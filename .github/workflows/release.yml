name: Release

# Pushing a tag such as v0.1.0 (or v0.1.0-rc1 for a pre-release) builds the
# .deb package and publishes it on the GitHub releases page.
#
# The build job can only read the repository and uses no cache, so nothing
# a pull request could have left behind ends up in the package. Only the
# publish job may write, and it runs no repository code.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check that the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$base" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Run the tests
        run: cargo test --workspace --locked

      - name: Build the package
        run: |
          cargo install cargo-deb --locked
          packaging/deb/stage.sh

      - name: Write the release notes and checksum
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "$" { on = 1; next }
            /^## / { on = 0 }
            on
          ' CHANGELOG.md > target/debian/notes.md
          if [ ! -s target/debian/notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
          cd target/debian
          sha256sum keysteel_*.deb > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            target/debian/keysteel_*.deb
            target/debian/SHA256SUMS
            target/debian/notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Keysteel $GITHUB_REF_NAME" \
            --notes-file notes.md \
            keysteel_*.deb SHA256SUMS
