[workspace]
resolver = "2"
members = ["crates/keysteel-core", "crates/keysteel-hid", "crates/keysteel-daemon", "crates/keysteel-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Adeptum AB", "Adam Waldenberg"]
repository = "https://github.com/adeptum-labs/keysteel"
homepage = "https://github.com/adeptum-labs/keysteel"
readme = "README.md"
rust-version = "1.80"
keywords = ["steelseries", "keyboard", "oled", "rgb", "linux"]
